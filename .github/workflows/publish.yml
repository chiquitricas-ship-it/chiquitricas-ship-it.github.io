name: Publish reviewed MAC-D interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed static package
        run: |
          unzip site.zip -d bundle
          echo '077ab78eb7248242b9b9102857a055c0a709d88e3ef7b2f3ecff356a52a653e6  bundle/artifact.tar' | sha256sum -c -
      - name: Prepare public files
        run: |
          mkdir -p public/netguard
          tar -xf bundle/artifact.tar -C public/netguard
          touch public/.nojekyll
          printf '%s' '<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/netguard/"><title>MAC-D</title><a href="/netguard/">Abrir MAC-D</a></html>' > public/index.html
          cp public/netguard/404.html public/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish interface
        id: deployment
        uses: actions/deploy-pages@v4
